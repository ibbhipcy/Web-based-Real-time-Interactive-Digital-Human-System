<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字角色生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); padding: 40px; max-width: 600px; width: 100%; margin: 20px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 28px; }
        .input-group { display: flex; align-items: center; margin-bottom: 20px; gap: 15px; width: 100%; }
        .input-label { min-width: 120px; font-weight: 600; color: #555; font-size: 16px; }
        .input-field { flex: 1; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; }
        .generate-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; }
        .generate-btn:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }
        .loading-container { text-align: center; display: none; }
        .loading-container.active { display: block; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #666; font-size: 16px; margin-top: 10px; }
        .image-container { display: none; text-align: center; }
        .image-container.active { display: block; }
        .character-image { max-width: 100%; max-height: 70vh; border-radius: 10px; margin-bottom: 30px; }
        .image-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .image-btn { padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .regenerate-btn { background: #f0f0f0; color: #333; }
        .like-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .error-message { background: #fee; color: #c33; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; width: 100%; }
        .error-message.active { display: block; }
        
        .video-container { display: none; }
        .video-container.active { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
        .left-panel { flex: 6; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        .left-panel video { width: 100%; height: 100%; object-fit: contain; }
        .right-panel { flex: 4; background: #f5f7fa; display: flex; flex-direction: column; border-left: 1px solid #ddd; }
        .chat-header { padding: 15px 20px; background: white; border-bottom: 1px solid #eee; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .message.ai { align-self: flex-start; background: white; color: #333; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
        .message.user { align-self: flex-end; background: #667eea; color: white; border-bottom-right-radius: 4px; }
        
        .chat-input-area { padding: 15px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .file-upload-btn { background: #f0f0f0; color: #555; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .file-upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-input-area button.send-btn { padding: 0 20px; height: 42px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .back-btn { padding: 8px 15px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div id="inputForm">
            <h1>数字角色生成器</h1>
            <div class="input-group"><label class="input-label">发型关键词：</label><input type="text" id="hair" class="input-field" placeholder="例如：长发、棕色、卷发"></div>
            <div class="input-group"><label class="input-label">人物整体关键词：</label><input type="text" id="figure" class="input-field" placeholder="例如：女性、中等身高、苗条"></div>
            <div class="input-group"><label class="input-label">面部关键词：</label><input type="text" id="facial" class="input-field" placeholder="例如：大眼睛、高鼻梁、樱桃小嘴"></div>
            <div class="input-group"><label class="input-label">穿搭关键词：</label><input type="text" id="appearance" class="input-field" placeholder="例如：白色T恤、牛仔裤、运动鞋"></div>
            <button id="generateBtn" class="generate-btn" disabled>生成视频</button>
            <div id="errorMessage" class="error-message"></div>
        </div>
        <div id="loadingContainer" class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">正在生成图片，请稍候...</div>
        </div>
        <div id="imageContainer" class="image-container">
            <h1>生成的角色图片</h1>
            <img id="characterImage" class="character-image" src="" alt="角色图片">
            <div class="image-buttons">
                <button id="regenerateBtn" class="image-btn regenerate-btn">regenerate</button>
                <button id="likeBtn" class="image-btn like-btn">i like this</button>
            </div>
        </div>
    </div>

    <div id="videoContainer" class="video-container">
        <div class="left-panel">
            <video id="videoPlayer" controls autoplay loop>
                您的浏览器不支持视频播放。
            </video>
        </div>
        <div class="right-panel">
            <div class="chat-header">
                <span>与 Nova 对话中</span>
                <button class="back-btn" onclick="restart()">重新生成</button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">你好！我是 Nova，很高兴认识你。你可以跟我聊聊天哦！</div>
            </div>
            <div class="chat-input-area">
                <input type="file" id="audioFileInput" accept=".mp3, .wav, .m4a, .webm" style="display: none;" onchange="uploadAudio()">
                <button class="file-upload-btn" id="micBtn" title="上传音频识别" onclick="document.getElementById('audioFileInput').click()">🎤</button>
                <input type="text" id="chatInput" placeholder="输入你想说的话..." onkeypress="handleEnter(event)">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        const hairInput = document.getElementById('hair');
        const figureInput = document.getElementById('figure');
        const facialInput = document.getElementById('facial');
        const appearanceInput = document.getElementById('appearance');
        const generateBtn = document.getElementById('generateBtn');
        const inputForm = document.getElementById('inputForm');
        const loadingContainer = document.getElementById('loadingContainer');
        const loadingText = document.getElementById('loadingText');
        const imageContainer = document.getElementById('imageContainer');
        const characterImage = document.getElementById('characterImage');
        const regenerateBtn = document.getElementById('regenerateBtn');
        const likeBtn = document.getElementById('likeBtn');
        const videoContainer = document.getElementById('videoContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const errorMessage = document.getElementById('errorMessage');
        const mainContainer = document.getElementById('mainContainer');

        let currentCharacterUrl = '';
        let currentImageFilename = '';
        let currentInputData = {};

        function checkInputs() {
            const allFilled = hairInput.value.trim() && figureInput.value.trim() && facialInput.value.trim() && appearanceInput.value.trim();
            generateBtn.disabled = !allFilled;
        }
        [hairInput, figureInput, facialInput, appearanceInput].forEach(input => input.addEventListener('input', checkInputs));

        async function generateCharacterImage() {
            errorMessage.classList.remove('active');
            currentInputData = { hair: hairInput.value.trim(), figure: figureInput.value.trim(), facial: facialInput.value.trim(), appearance: appearanceInput.value.trim() };
            inputForm.style.display = 'none'; imageContainer.classList.remove('active'); videoContainer.classList.remove('active'); loadingContainer.classList.add('active'); loadingText.textContent = '正在生成图片，请稍候...';
            try {
                const response = await fetch('/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentInputData) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '生成失败');
                if (data.success) {
                    currentCharacterUrl = data.character_url || '';
                    loadingContainer.classList.remove('active'); imageContainer.classList.add('active');
                    characterImage.src = data.image_filename ? `/image/${data.image_filename}` : currentCharacterUrl;
                } else { throw new Error('未收到图片'); }
            } catch (error) {
                loadingContainer.classList.remove('active'); inputForm.style.display = 'block'; imageContainer.classList.remove('active');
                errorMessage.textContent = '错误: ' + error.message; errorMessage.classList.add('active');
            }
        }

        async function generateVideo() {
            imageContainer.classList.remove('active'); loadingContainer.classList.add('active'); loadingText.textContent = '正在生成视频，请稍候...';
            try {
                const response = await fetch('/generate_video', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ character_url: currentCharacterUrl }) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '生成失败');
                if (data.success && data.video_path) {
                    mainContainer.style.display = 'none'; loadingContainer.classList.remove('active'); videoContainer.classList.add('active');
                    videoPlayer.src = `/video/${data.video_path}`; videoPlayer.load();
                } else { throw new Error('未收到视频'); }
            } catch (error) {
                loadingContainer.classList.remove('active'); imageContainer.classList.add('active'); videoContainer.classList.remove('active');
                errorMessage.textContent = '错误: ' + error.message; errorMessage.classList.add('active');
            }
        }

        generateBtn.addEventListener('click', generateCharacterImage);
        regenerateBtn.addEventListener('click', generateCharacterImage);
        likeBtn.addEventListener('click', generateVideo);

        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const audioFileInput = document.getElementById('audioFileInput');
        const micBtn = document.getElementById('micBtn');
        const audioQueue = [];
        let isPlaying = false;
        let currentAudioObj = null;

        function handleEnter(event) { if (event.key === 'Enter') sendMessage(); }

        function playAudio(url) {
            audioQueue.push(url);
            if (!isPlaying) processAudioQueue();
        }

        function processAudioQueue() {
            if (audioQueue.length === 0) { isPlaying = false; return; }
            isPlaying = true;
            const url = audioQueue.shift();
            if (currentAudioObj) currentAudioObj.pause();
            currentAudioObj = new Audio(url);
            currentAudioObj.onended = () => processAudioQueue();
            currentAudioObj.onerror = () => processAudioQueue();
            currentAudioObj.play().catch(e => { console.error(e); processAudioQueue(); });
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            appendMessage('user', text);
            chatInput.value = ''; sendBtn.disabled = true; sendBtn.textContent = '...';
            audioQueue.length = 0;
            if (currentAudioObj) { currentAudioObj.pause(); currentAudioObj = null; }
            isPlaying = false;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            chatMessages.appendChild(aiMsgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, character_url: currentCharacterUrl })
                });
                if (!response.body) throw new Error('不支持流式');
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let done = false;
                let buffer = '';

                while (!done) {
                    const { value, done: readerDone } = await reader.read();
                    done = readerDone;
                    if (value) {
                        buffer += decoder.decode(value, { stream: true });
                        let parts = buffer.split('\n\n');
                        buffer = parts.pop();
                        for (let part of parts) {
                            if (part.startsWith('data: ')) {
                                const dataStr = part.substring(6);
                                if (dataStr === '[DONE]') continue;
                                try {
                                    const data = JSON.parse(dataStr);
                                    if (data.text) {
                                        aiMsgDiv.textContent += data.text;
                                        chatMessages.scrollTop = chatMessages.scrollHeight;
                                    }
                                    if (data.audio_url) playAudio(data.audio_url);
                                } catch (e) {}
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('发送失败:', error);
                aiMsgDiv.textContent = '网络开小差了，请稍后再试。';
            } finally {
                sendBtn.disabled = false; sendBtn.textContent = '发送';
            }
        }

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function uploadAudio() {
            const file = audioFileInput.files[0];
            if (!file) return;
            micBtn.disabled = true; micBtn.textContent = '⏳'; chatInput.disabled = true; chatInput.placeholder = "正在识别语音...";
            const formData = new FormData(); formData.append('audio', file);
            try {
                const response = await fetch('/asr', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.success && data.text) { chatInput.value = data.text; }
                else { alert('语音识别失败: ' + (data.error || '未知错误')); }
            } catch (error) { alert('语音识别网络请求失败'); }
            finally {
                micBtn.disabled = false; micBtn.textContent = '🎤'; chatInput.disabled = false; chatInput.placeholder = "输入你想说的话...";
                audioFileInput.value = ''; chatInput.focus();
            }
        }

        async function restart() {
            try { await fetch('/clear_history', { method: 'POST' }); } catch(e) {}
            location.reload();
        }

        // 无缝替换视频轮询
        setInterval(async () => {
            if (!videoContainer.classList.contains('active')) return;
            try {
                const res = await fetch('/get_new_video');
                const data = await res.json();
                if (data.success && data.video_path) {
                    const newVideoSrc = `/video/${data.video_path}`;
                    const tempVideo = document.createElement('video');
                    tempVideo.src = newVideoSrc;
                    tempVideo.muted = true;
                    tempVideo.addEventListener('canplaythrough', () => {
                        videoPlayer.src = newVideoSrc;
                        videoPlayer.play().catch(e => console.log("切换视频时播放失败:", e));
                    });
                }
            } catch (e) {}
        }, 10000);
    </script>
</body>
</html>
